var(--muted);font-weight:500}.layer{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid transparent;border-radius:10px;color:var(--muted);cursor:pointer}.layer.active{background:#30352d;border-color:#59634c;color:var(--ink)}.layer .dot{width:8px;height:8px;border-radius:50%;background:var(--lime)}.layer button{margin-left:auto;padding:3px 6px}.control{display:grid;gap:7px;color:var(--muted);font-size:12px}.control input{width:100%;accent-color:var(--lime)}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid #ffffff33}.bottom{border-top:1px solid var(--line);background:#1c1e1b;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:8px}.timeline{display:flex;align-items:center;gap:8px;min-width:0}.timeline input{width:min(34vw,220px);accent-color:var(--lime)}.status{font-size:11px;color:var(--muted)}.mobile-panels{display:none}

/* PAPER-COMIC ART DIRECTION */
:root{color-scheme:light;--bg:#eee5d2;--panel:#fff8e9;--panel2:#f6ecd8;--line:#282321;--ink:#282321;--muted:#74695d;--lime:#d8ff3e;--orange:#ff684d;--cyan:#5edce0;--violet:#8a68dc}
html,body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",ui-rounded,system-ui,sans-serif}
body{background-image:radial-gradient(#3a30251a .8px,transparent .8px);background-size:7px 7px}
button{position:relative;overflow:hidden;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px 8px 5px 7px;box-shadow:3px 3px 0 var(--line);font-weight:800;transition:transform .16s cubic-bezier(.2,.9,.2,1.3),box-shadow .16s,background .16s}
button:hover{transform:translate(-1px,-2px) rotate(-1deg);box-shadow:5px 6px 0 var(--line)}
button:active{transform:translate(2px,2px) scale(.97) rotate(1deg);box-shadow:0 0 0 var(--line)}
button.active{background:var(--lime);border-color:var(--line);color:var(--ink);box-shadow:3px 3px 0 var(--orange)}
.app{background:transparent}
.top{position:relative;z-index:2;background:#f9efd9;border-bottom:3px solid var(--line);box-shadow:0 4px 0 #28232120}
.brand{font-size:19px;font-weight:1000;letter-spacing:-1.2px;text-transform:uppercase;text-shadow:2px 2px 0 var(--cyan)}
.brand span{display:inline-block;color:var(--orange);transform:rotate(-4deg);text-shadow:2px 2px 0 var(--line)}
.sub{font-size:9px;font-weight:900;letter-spacing:2px;color:#6d6255}
.workspace{gap:0}
.rail{position:relative;background:#f0dfc1;border-right:3px solid var(--line);padding-top:14px}
.tool{width:42px;height:44px;font-size:20px;border-radius:6px 10px 5px 8px}
.viewport{background-color:#e7d7b9;background-image:radial-gradient(#30271f30 1px,transparent 1px),linear-gradient(135deg,#f5e9d1,#ddc9a6);background-size:9px 9px,100% 100%}
.viewport:before{content:"";position:absolute;inset:13px;border:2px dashed #51433330;border-radius:3px;pointer-events:none;z-index:0}
#stage{position:relative;z-index:1}
#eraserPreviewCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.mode-pill{top:22px;left:22px;background:#fff8e9;color:#282321;border:2px solid #282321;border-radius:3px;box-shadow:3px 3px 0 var(--orange);font-weight:1000;letter-spacing:1px}
.hint{background:#282321;color:#fff8e9;border:2px solid #282321;border-radius:4px;box-shadow:4px 4px 0 var(--cyan);font-weight:700}
.side{position:relative;background-color:#fff6e5;background-image:radial-gradient(#5a49321a .8px,transparent .8px);background-size:8px 8px;border-left:3px solid var(--line);padding:16px}
.side:before{content:"";position:absolute;top:0;left:12px;right:12px;height:7px;background:repeating-linear-gradient(90deg,var(--orange) 0 18px,transparent 18px 24px,var(--cyan) 24px 42px,transparent 42px 48px);opacity:.9}
.section-head{font-size:13px;font-weight:1000;text-transform:uppercase;letter-spacing:1px}
.section-head small{font-size:9px;letter-spacing:1px}
.layer{margin:6px 0;background:#f4e8d2;border:2px solid transparent;border-radius:4px;color:#5e5145;font-weight:800;transition:transform .18s,background .18s}
.layer:hover{transform:translateX(3px) rotate(-.5deg)}
.layer.active{background:#dff3e7;border:2px solid var(--line);color:var(--ink);box-shadow:3px 3px 0 var(--cyan)}
.layer .dot{border:1px solid var(--line);background:var(--orange)}
.layer button{box-shadow:none;border-width:1px;padding:2px 6px}
.control{color:#5e5145;font-weight:800}
.control input{accent-color:#ff684d}
.swatch{border:2px solid var(--line);box-shadow:2px 2px 0 #28232155}
.bottom{background:#f8ecd5;border-top:3px solid var(--line);box-shadow:0 -4px 0 #28232114}
.bottom button{font-size:11px}
.status{color:#65584c;font-weight:900;letter-spacing:1px}
input[type=range]{cursor:grab}
input[type=range]:active{cursor:grabbing}
@keyframes paperIn{0%{opacity:0;transform:translateY(14px) rotate(1.5deg)}70%{transform:translateY(-2px) rotate(-.5deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes stamp{0%{transform:scale(1.16) rotate(-4deg)}55%{transform:scale(.94) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.layer{animation:paperIn .34s both}
.layer:nth-child(2){animation-delay:.04s}.layer:nth-child(3){animation-delay:.08s}.layer:nth-child(4){animation-delay:.12s}
button.active{animation:stamp .24s ease-out}
@media(max-width:760px){.side.open{background-color:#fff6e5;border-left:3px solid var(--line);box-shadow:-8px 0 0 #28232125}.brand{font-size:15px}.top{background:#f9efd9}.tool{width:39px}.viewport:before{inset:8px}.mode-pill{top:16px;left:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}


/* COMIC STUDIO INTERACTION PASS */
.viewport:after{content:"";position:absolute;z-index:0;inset:5.5% 5%;pointer-events:none;background-color:#fff9e9;background-image:radial-gradient(#7b67451b .7px,transparent .7px),linear-gradient(135deg,#fffdf4,#f4e8cf);background-size:7px 7px,100% 100%;border:2px solid #282321;box-shadow:8px 9px 0 #282321,12px 13px 0 var(--orange);clip-path:polygon(0 1%,8% 0,17% 1%,26% 0,37% 1%,48% 0,60% 1%,72% 0,83% 1%,100% 0,99% 18%,100% 34%,99% 50%,100% 68%,99% 84%,100% 100%,82% 99%,65% 100%,48% 99%,31% 100%,14% 99%,0 100%,1% 82%,0 66%,1% 49%,0 32%,1% 16%);opacity:.92}
.viewport:before{z-index:0;inset:4.5%;border:2px dashed #51433335}
#stage{z-index:1}
#brushCursor{position:absolute;z-index:4;width:24px;height:24px;border:2px solid #282321;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;box-shadow:2px 2px 0 var(--orange),inset 0 0 0 3px #fff9e9aa;mix-blend-mode:multiply}
#brushCursor:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--cursor-color,var(--orange))}
.contact-toggle{position:absolute;z-index:9;right:16px;top:14px;border:2px solid #282321;background:#fff4db;color:#282321;box-shadow:3px 4px 0 #282321;padding:8px 11px;font-weight:800}
.contact-panel{position:absolute;z-index:10;right:16px;top:60px;width:min(260px,calc(100% - 32px));padding:13px;background:#fff4db;border:2px solid #282321;box-shadow:5px 6px 0 #282321;color:#282321;display:none;gap:11px}
.contact-panel.open{display:grid;animation:contactPop .18s ease-out}
@keyframes contactPop{from{opacity:0;transform:translateY(-7px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.contact-preview-wrap{display:flex;align-items:center;justify-content:center;min-height:74px;background:#ead9b8;border:1px dashed #8a7658}
#contactFootprint{width:34px;height:34px;border:2px solid #282321;border-radius:50%;background:#ff9b61aa;box-shadow:2px 2px 0 #282321;transform-origin:center}
.contact-panel .control{color:#514333}.contact-panel input{accent-color:#e76c42}
.contact-panel .panel-title{font-weight:900;display:flex;justify-content:space-between;align-items:center}
@media(max-width:760px){.contact-toggle{top:56px;right:12px;padding:7px 9px}.contact-panel{top:101px;right:12px;width:min(245px,calc(100% - 24px))}}

.comic-pop{position:fixed;z-index:30;pointer-events:none;font-size:13px;font-weight:1000;letter-spacing:1px;color:#282321;background:var(--lime);border:2px solid #282321;padding:5px 9px;box-shadow:3px 3px 0 #282321;transform:translate(-50%,-50%) rotate(-8deg);animation:comicPop .62s cubic-bezier(.18,.85,.25,1) forwards}
@keyframes comicPop{0%{opacity:0;transform:translate(-50%,-35%) scale(.25) rotate(-20deg)}35%{opacity:1;transform:translate(-50%,-65%) scale(1.18) rotate(5deg)}70%{opacity:1;transform:translate(-50%,-95%) scale(.96) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-145%) scale(.8) rotate(7deg)}}
@keyframes panelShuffle{0%{opacity:0;transform:translateX(24px) rotate(2deg)}70%{opacity:1;transform:translateX(-4px) rotate(-.5deg)}100%{transform:translateX(0) rotate(0)}}
.side.open{animation:panelShuffle .32s cubic-bezier(.2,.8,.2,1) both}
.swatch{position:relative;transition:transform .16s,box-shadow .16s}
.swatch.selected{outline:2px dashed #282321;outline-offset:3px;transform:translateY(-3px) rotate(-7deg);box-shadow:3px 4px 0 #282321}
.section-head{position:relative;padding-bottom:6px;border-bottom:2px solid #282321}
.section-head:after{content:"";position:absolute;bottom:-3px;left:0;width:28px;height:4px;background:var(--orange);transform:rotate(-2deg)}
.top-actions button,.bottom button,.rail button{will-change:transform}
.camera-dock{position:absolute;z-index:8;right:16px;top:16px;display:flex;gap:6px;padding:6px;background:#fff8e9eF;border:2px solid #282321;box-shadow:3px 3px 0 #282321;border-radius:5px}
.camera-dock button{min-width:34px;height:34px;padding:4px 8px;font-size:16px;line-height:1}
.camera-dock button:last-child{font-size:12px}
@media(max-width:760px){.camera-dock{right:10px;top:10px;gap:4px;padding:4px}.camera-dock button{min-width:30px;height:30px;padding:3px 6px;font-size:14px}.camera-dock button:last-child{font-size:10px}}
@media(max-width:760px){.viewport:after{inset:6% 4% 7%;box-shadow:5px 6px 0 #282321,8px 9px 0 var(--orange)}#brushCursor{display:none!important}}
@media(prefers-reduced-motion:reduce){.comic-pop{display:none}.side.open{animation:none}}



/* SCENE / UI STACKING FIX
   The renderer stays beneath every viewport overlay. */
.viewport{isolation:isolate}
#stage{position:relative;z-index:1}
.viewport:before,.viewport:after{z-index:0}
.mode-pill,.hint{position:absolute;z-index:6}
#brushCursor{z-index:7}

/* RESPONSIVE PHONE MODE
   Keep the full studio on desktop, but let the phone layout fit its viewport. */
@media(max-width:760px){
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y pinch-zoom}
  .app{width:100%;min-width:0;height:100dvh;min-height:0;grid-template-rows:54px minmax(0,1fr) 62px}
  .top{padding:0 9px;gap:7px}
  .brand{font-size:15px;letter-spacing:-.7px}
  .sub{font-size:8px;letter-spacing:1.2px}
  .top-actions{gap:6px}
  .top-actions button{padding:8px 9px;font-size:12px}
  .workspace{min-height:0;min-width:0;grid-template-columns:48px minmax(0,1fr)}
  .rail{display:flex;padding:8px 3px;gap:9px}
  .tool{width:39px;height:42px;font-size:18px}
  .viewport{min-width:0;min-height:0}
  .side{display:none}
  .side.open{display:flex;position:absolute;z-index:8;right:0;top:54px;bottom:62px;width:min(290px,84vw);box-shadow:-12px 0 30px #28232155;overflow:auto}
  .mobile-panels{display:inline-flex}
  .bottom{min-width:0;padding:7px 9px;gap:6px}
  .bottom .tools{gap:6px;min-width:0}
  .bottom button{padding:8px 9px;font-size:10px;white-space:nowrap}
  .timeline{gap:5px;min-width:0;flex:1;justify-content:flex-end}
  .timeline input{width:clamp(52px,18vw,110px);min-width:0}
  .status{display:none}
  .viewport:before{inset:8px}
  .viewport:after{inset:6% 4% 7%;box-shadow:5px 6px 0 #282321,8px 9px 0 var(--orange)}
  .mode-pill{top:12px;left:12px;padding:6px 8px;font-size:9px}
  .hint{left:12px;bottom:12px;max-width:calc(100% - 24px);font-size:10px}
}
@media(max-width:390px){
  .brand{font-size:13px}
  .top-actions button{padding:7px 7px}
  .bottom button{padding:7px 7px;font-size:9px}
  .timeline input{width:48px}
}
@media(max-width:760px) and (orientation:landscape){
  .app{grid-template-rows:48px minmax(0,1fr) 54px}
  .side.open{top:48px;bottom:54px}
  .rail{padding:5px 3px;gap:6px}
  .tool{height:36px}
  .bottom{padding:5px 8px}
  .viewport:after{inset:4% 5%}
}
.transform-modes{position:absolute;z-index:8;left:50%;top:14px;transform:translateX(-50%);display:none;gap:4px;padding:4px;background:#fff4db;border:2px solid #282321;box-shadow:3px 4px 0 #282321}.transform-modes.open{display:flex}.transform-modes button{min-width:38px;height:34px;border:1.5px solid #282321;background:#f3e3c3;color:#282321;font-weight:900}.transform-modes button.active{background:#ff9473;box-shadow:inset 0 -3px 0 #b74c31}}
/* LANDSCAPE QUICK ACTIONS
   Keep the primary layer action visible; tuck Clear and Export behind the ellipsis. */
@media(max-width:760px) and (orientation:landscape){
  .bottom{position:relative;display:flex;align-items:center;justify-content:flex-start;padding-right:10px}
  .bottom .tools{position:static;display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap}
  .bottom .tools #clearBtn,.bottom .tools #exportBtn{display:none}
  .bottom .tools.expanded #clearBtn,.bottom .tools.expanded #exportBtn{display:inline-flex}
  .bottom .tools .quick-actions-toggle{display:inline-flex;min-width:38px;justify-content:center;font-weight:1000;letter-spacing:2px}
  .bottom .timeline{order:2;flex:1;min-width:0;justify-content:flex-end}
  .bottom .timeline input{width:clamp(48px,12vw,90px)}
}
@media(min-width:761px){
  .quick-actions-toggle{display:none}
}
</style>

<body>
<div class="app">
<header class="top"><div><div class="brand">TETHERLESS<span>3D</span></div><div class="sub">CUT PAPER · INK · IMAGINATION</div></div><div class="top-actions"><button id="panelBtn" class="mobile-panels">☷</button><button id="saveBtn">Save</button></div></header>
<main class="workspace"><nav class="rail">
<button class="tool active" id="drawTool" title="Draw">✎</button><button class="tool" id="eraseTool" title="Eraser">⌫</button><button class="tool" id="moveTool" title="Move strokes">✥</button><button class="tool" id="selectTool" title="Select / transform">↗</button><button class="tool" id="undoBtn" title="Undo">↶</button><button class="tool" id="redoBtn" title="Redo">↷</button>
</nav><section class="viewport"><canvas id="stage"></canvas><canvas id="eraserPreviewCanvas" aria-hidden="true"></canvas><div id="brushCursor"></div><div class="mode-pill" id="modeLabel">3D DRAWING SPACE</div><div class="camera-dock" aria-label="Camera controls"><button id="zoomOut" title="Zoom out">−</button><button id="zoomIn" title="Zoom in">＋</button><button id="cameraReset" title="Reset camera">⌂</button></div><div class="hint" id="hint">Draw · Choose Move, then tap a stroke and drag it · Two fingers orbit + pinch to zoom</div><div id="engineError" role="status" style="display:none;position:absolute;z-index:20;left:12px;right:12px;top:64px;padding:12px;background:#fff0e8;border:2px solid #9d3022;color:#6b2018;font-weight:800;white-space:pre-wrap">3D engine error</div></section>
<aside class="side" id="side">
<div><div class="section-head">Layers <button id="addLayer">＋</button></div><div id="layers"></div></div>
<div><div class="section-head">Brush <small id="sizeVal">6 px</small></div>
<label class="control">Brush size <input id="brushSize" type="range" min="1" max="36" value="6"></label>
<label class="control">Eraser radius <small id="eraserSizeVal">6 px</small><input id="eraserSize" type="range" min="1" max="36" value="6"></label>
<label class="control">Opacity<input id="opacity" type="range" min="10" max="100" value="100"></label>
<label class="control">Speed response <small id="velocitySensitivityVal">100%</small><input id="velocitySensitivity" type="range" min="0" max="200" value="100"></label>
<label class="control">End taper <small id="taperVal">35%</small><input id="taper" type="range" min="0" max="100" value="35"></label>
<div class="swatches" id="swatches"><button class="swatch" data-color="#d9f78a" style="background:#d9f78a"></button><button class="swatch" data-color="#ff9473" style="background:#ff9473"></button><button class="swatch" data-color="#8bd9ff" style="background:#8bd9ff"></button><button class="swatch" data-color="#f1eee4" style="background:#f1eee4"></button><button class="swatch" data-color="#c49aff" style="background:#c49aff"></button></div></div>
<div><div class="section-head">Animation <small>keyframes</small></div><button id="keyBtn" style="width:100%">＋ Add keyframe</button><button id="playBtn" style="width:100%;margin-top:7px">▶ Play preview</button><div class="sub" id="frameInfo" style="margin-top:7px">0 keyframes · 12 FPS</div></div>
</aside></main>
<footer class="bottom"><div class="tools"><button id="newBtn">＋ Layer</button><button id="clearBtn">Clear</button><button id="exportBtn">Export PNG</button><button id="quickActionsToggle" class="quick-actions-toggle" type="button" aria-label="More actions" aria-expanded="false" onclick="this.parentElement.classList.toggle('expanded');this.setAttribute('aria-expanded',this.parentElement.classList.contains('expanded'))">•••</button></div><div class="timeline"><span class="status">FRAME</span><input id="frameSlider" type="range" min="0" max="100" value="0"><span id="frameNo" class="status">0</span></div></footer>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
(function(){
 const panel=document.getElementById('engineError');
 function showEngineError(message){
  if(!panel)return;
  panel.style.display='block';
  panel.textContent='3D ENGINE ERROR · '+String(message||'Unknown error').slice(0,240);
 }
 window.addEventListener('error',e=>showEngineError(e.message||e.error));
 window.addEventListener('unhandledrejection',e=>showEngineError(e.reason?.message||e.reason));
})();
</script>
<script type="module">
import * as THREE from 'three';
import {TransformControls} from 'three/addons/controls/TransformControls.js';

  }else if(e.button===2||e.button===1){mouseCamera={id:e.pointerId,x:e.clientX,y:e.clientY,pan:e.button===1||e.shiftKey};try{canvas.setPointerCapture(e.pointerId);}catch{}return;}
  if(transform.dragging||gizmoDragging)return;
  if(tool==='move'){
    const group=layers[activeLayer].group,hit=findStrokeAtScreen(e.clientX,e.clientY,group);
    // Empty canvas taps are not deselection gestures. Tap the selected stroke
    // again to clear it; otherwise the current selection stays attached.
    if(hit)selectStroke(hit===selectedStroke?null:hit);
    return;
  }
  if(tool!=='draw'&&tool!=='erase')return;
  prepareStrokePlane();const startPoint=pointFromEvent(e);if(!startPoint)return;
  beginPendingDraw({x:e.clientX,y:e.clientY,timeStamp:e.timeStamp,tool,group:layers[activeLayer].group,point:startPoint});
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'&&activePointers.has(e.pointerId)){
    const previous=activePointers.get(e.pointerId);
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(activePointers.size>=2){
      const pts=[...activePointers.values()];
      if(!gestureState){beginTwoFingerGesture();return;}
      const cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;
      const distance=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
      cameraOrbit(cx-gestureState.x,cy-gestureState.y);
      if(gestureState.distance>1&&distance>1)zoomBy(gestureState.distance/distance);
      gestureState={x:cx,y:cy,distance};return;
    }
  }
  if(mouseCamera&&mouseCamera.id===e.pointerId){
    const dx=e.clientX-mouseCamera.x,dy=e.clientY-mouseCamera.y;
    if(mouseCamera.pan)cameraPan(dx,dy);else cameraOrbit(dx,dy);
    mouseCamera.x=e.clientX;mouseCamera.y=e.clientY;return;
  }
  if(!drawing||gizmoDragging)return;
  const point=pointFromEvent(e);if(!point)return;
  if(currentPoints[currentPoints.length-1].distanceTo(point)>Math.max(.018,brushSize*.0025)){
    currentPoints.push(point);if(activeStrokeTool==='draw')currentBrushSamples.push(sampleBrushVelocity(e));if(activeStrokeTool==='erase')addEraserScreenPoint(e);
    if(currentPoints.length>700){const compact=currentPoints.filter((_,i)=>i%2===0),compactSamples=currentBrushSamples.filter((_,i)=>i%2===0);if(compact[compact.length-1]!==currentPoints[currentPoints.length-1]){compact.push(currentPoints[currentPoints.length-1]);if(currentBrushSamples.length)compactSamples.push(currentBrushSamples[currentBrushSamples.length-1]);}currentPoints=compact;currentBrushSamples=compactSamples;}
    scheduleStrokePreview();
  }
});
function endPointer(e){
  if(activePointers.has(e.pointerId)){
    activePointers.delete(e.pointerId);gestureState=null;
    if(activePointers.size===0){if(drawing)finishStroke(true);else currentPoints=[];}
    return;
  }
  if(mouseCamera&&mouseCamera.id===e.pointerId){mouseCamera=null;return;}
  if(drawing)finishStroke(true);
}
canvas.addEventListener('pointerup',endPointer);
function cancelPointer(e){
  if(activePointers.has(e.pointerId)){
    activePointers.delete(e.pointerId);gestureState=null;
    if(drawing)finishStroke(false);
    if(activePointers.size===0)currentPoints=[];
  }
  if(mouseCamera&&mouseCamera.id===e.pointerId)mouseCamera=null;
  if(drawing&&!activePointers.size&&!mouseCamera)finishStroke(false);
}
canvas.addEventListener('pointercancel',cancelPointer);
canvas.addEventListener('lostpointercapture',cancelPointer);
window.addEventListener('blur',()=>{activePointers.clear();gestureState=null;mouseCamera=null;if(drawing)finishStroke(false);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){activePointers.clear();gestureState=null;mouseCamera=null;if(drawing)finishStroke(false);}});
function setTool(t){if(drawing)finishStroke(true);clearPreview();if(tool==='move'&&t!=='move'&&selectedStroke){highlightStroke(selectedStroke,false);selectedStroke=null;transform.detach();}tool=t;document.querySelectorAll('.rail .tool').forEach(b=>b.classList.remove('active'));({draw:'#drawTool',erase:'#eraseTool',move:'#moveTool',select:'#selectTool',orbit:'#orbitTool'}[t]&&document.querySelector(({draw:'#drawTool',erase:'#eraseTool',move:'#moveTool',select:'#selectTool',orbit:'#orbitTool'}[t])).classList.add('active'));if(t==='draw'||t==='erase'){transform.detach();orbit.enabled=false;}if(t==='move'){orbit.enabled=false;if(selectedStroke){transform.attach(selectedStroke);}else transform.detach();}if(t==='select'){orbit.enabled=false;const g=layers[activeLayer].group;if(g.children.length)transform.attach(g);}if(t==='orbit'){transform.detach();orbit.enabled=true;orbit.enableRotate=true;orbit.enablePan=true;orbit.enableZoom=true;}canvas.style.cursor=t==='draw'||t==='erase'?'none':t==='move'?'grab':'grab';brushCursor.style.display='none';document.querySelector('#hint').textContent=t==='move'?'Tap a stroke to select it, then use the 3D gizmo to move, rotate or scale it':t==='erase'?'Erase parts of strokes on the active layer · Two fingers orbit + pinch to zoom':t==='select'?'Select the active layer and use its 3D transform gizmo':'Draw on the view plane · Rotate the camera to change drawing direction · Two fingers orbit + pinch to zoom';}

document.querySelector('#drawTool').onclick=()=>setTool('draw');document.querySelector('#eraseTool').onclick=()=>setTool(tool==='erase'?'draw':'erase');document.querySelector('#moveTool').onclick=()=>setTool(tool==='move'?'draw':'move');document.querySelector('#selectTool').onclick=()=>setTool(tool==='select'?'draw':'select');
function resetCamera(){orbit.target.set(0,0,0);camera.up.set(0,1,0);camera.position.set(9,7,12);camera.lookAt(0,0,0);camera.fov=42;camera.updateProjectionMatrix();orbit.update();}
function cameraZoom(factor){const offset=camera.position.clone().sub(orbit.target);offset.multiplyScalar(factor);const distance=THREE.MathUtils.clamp(offset.length(),orbit.minDistance,orbit.maxDistance);offset.setLength(distance);camera.position.copy(orbit.target).add(offset);orbit.update();}document.querySelector('#zoomIn').onclick=()=>cameraZoom(.8);document.querySelector('#zoomOut').onclick=()=>cameraZoom(1.25);document.querySelector('#cameraReset').onclick=()=>{resetCamera();};
document.querySelector('#addLayer').onclick=()=>addLayer();document.querySelector('#newBtn').onclick=()=>addLayer();
document.querySelector('#brushSize').oninput=e=>{brushSize=+e.target.value;document.querySelector('#sizeVal').textContent=brushSize+' px';};
document.querySelector('#eraserSize').oninput=e=>{eraserRadiusPx=+e.target.value;document.querySelector('#eraserSizeVal').textContent=eraserRadiusPx+' px';if(drawing&&activeStrokeTool==='erase')scheduleStrokePreview();};
document.querySelector('#opacity').oninput=e=>opacity=+e.target.value/100;
document.querySelector('#velocitySensitivity').oninput=e=>{velocitySensitivity=+e.target.value/100;document.querySelector('#velocitySensitivityVal').textContent=e.target.value+'%';};
document.querySelector('#taper').oninput=e=>{endTaper=+e.target.value/100;document.querySelector('#taperVal').textContent=e.target.value+'%';};


document.querySelectorAll('.swatch').forEach((b,i)=>{if(i===0)b.classList.add('selected');b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected',s===b));document.querySelector('#brushCursor').style.setProperty('--cursor-color',color);};});
const brushCursor=document.querySelector('#brushCursor');
viewport.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||(tool!=='draw'&&tool!=='erase')){brushCursor.style.display='none';return;}const r=viewport.getBoundingClientRect();brushCursor.style.display='block';brushCursor.style.left=(e.clientX-r.left)+'px';brushCursor.style.top=(e.clientY-r.top)+'px';const diameter=Math.max(2,(tool==='erase'?eraserRadiusPx:brushSize)*2);brushCursor.style.width=brushCursor.style.height=diameter+'px';brushCursor.style.borderRadius=tool==='erase'?'3px':'50%';brushCursor.style.setProperty('--cursor-color',tool==='erase'?'#ff684d':color);});
viewport.addEventListener('pointerleave',()=>brushCursor.style.display='none');
function comicPop(x,y,label='NICE!'){const el=document.createElement('div');el.className='comic-pop';el.textContent=label;el.style.left=x+'px';el.style.top=y+'px';document.body.append(el);setTimeout(()=>el.remove(),650);}
document.querySelectorAll('.top-actions button,.bottom button,.rail button').forEach(btn=>btn.addEventListener('click',()=>{const r=btn.getBoundingClientRect();const labels={'saveBtn':'SAVED!','exportBtn':'INK IT!','addLayer':'NEW PAGE!','newBtn':'NEW PAGE!','clearBtn':'FRESH SHEET!','keyBtn':'SNAP!','playBtn':'ACTION!'};const label=labels[btn.id];if(label)comicPop(r.left+r.width/2,r.top+r.height/2,label);}));
document.querySelector('#clearBtn').onclick=()=>{const group=layers[activeLayer].group;if(!group.children.length)return;recordAction({type:'clear',group,objects:[...group.children]});group.clear();transform.detach();selectedStroke=null;};
document.querySelector('#undoBtn').onclick=undoAction;
document.querySelector('#redoBtn').onclick=redoAction;
document.querySelector('#saveBtn').onclick=()=>{const data={version:1,layers:root.toJSON(),keyframes};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='tetherless3d-project.json';a.click();URL.revokeObjectURL(a.href);};
document.querySelector('#exportBtn').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='tetherless3d-artwork.png';a.click();};
document.querySelector('#panelBtn').onclick=()=>document.querySelector('#side').classList.toggle('open');
document.querySelector('#keyBtn').onclick=()=>{const g=layers[activeLayer].group;keyframes.push({time:keyframes.length,layer:activeLayer,position:g.position.toArray(),rotation:g.rotation.toArray(),scale:g.scale.toArray()});document.querySelector('#frameInfo').textContent=keyframes.length+' keyframes · layer: '+layers[activeLayer].name;document.querySelector('#frameSlider').max=Math.max(100,keyframes.length*100);};
document.querySelector('#playBtn').onclick=()=>{playing=!playing;if(playing)playStart=performance.now();document.querySelector('#playBtn').textContent=playing?'Ⅱ Pause preview':'▶ Play preview';document.querySelector('#playBtn').classList.toggle('active',playing);};
document.querySelector('#frameSlider').oninput=e=>document.querySelector('#frameNo').textContent=e.target.value;
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();resizeEraserPreview();}
resizeEraserPreview();new ResizeObserver(resize).observe(viewport);
function animate(now){requestAnimationFrame(animate);orbit.update();if(playing&&keyframes.length>1){const duration=Math.max(1,...keyframes.map(k=>k.time));const t=((now-playStart)/1000)%duration;for(let li=0;li<layers.length;li++){const track=keyframes.filter(k=>k.layer===li).sort((a,b)=>a.time-b.time);if(!track.length)continue;let a=track[0],b=track[track.length-1];for(let j=0;j<track.length-1;j++){if(t>=track[j].time&&t<=track[j+1].time){a=track[j];b=track[j+1];break;}}const span=Math.max(.0001,b.time-a.time),f=THREE.MathUtils.clamp((t-a.time)/span,0,1),g=layers[li].group;g.position.fromArray(a.position).lerp(new THREE.Vector3(...b.position),f);g.rotation.set(...a.rotation.map((v,i)=>THREE.MathUtils.lerp(v,b.rotation[i],f)));g.scale.fromArray(a.scale).lerp(new THREE.Vector3(...b.scale),f);}}renderer.render(scene,camera);}
requestAnimationFrame(animate);renderLayers();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
