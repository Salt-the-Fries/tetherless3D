<html lang="en">
<head>

<title>Tetherless3D Studio</title>
<style>
:root{color-scheme:dark;--bg:#171817;--panel:#20221f;--panel2:#292c28;--line:#393d37;--ink:#f1eee4;--muted:#a4a99d;--lime:#c8f36a;--orange:#ff9e68}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.35 Inter,ui-sans-serif,system-ui,sans-serif}button,input{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:9px 12px;cursor:pointer;transition:transform .14s,background .14s,border-color .14s}button:active{transform:translateY(2px) scale(.98)}button.active{border-color:var(--lime);color:var(--lime);background:#303a25}.app{height:100dvh;display:grid;grid-template-rows:58px 1fr 58px}.top{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#1c1e1b;gap:10px}.brand{font-weight:800;letter-spacing:-.6px}.brand span{color:var(--lime)}.sub{font-size:11px;color:var(--muted)}.top-actions,.tools{display:flex;gap:7px;align-items:center}.workspace{min-height:0;display:grid;grid-template-columns:58px 1fr 250px}.rail{background:#1c1e1b;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px 6px}.tool{width:43px;height:43px;padding:0;font-size:18px}.viewport{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 45%,#282c27 0,#1b1e1b 60%,#171817 100%);overflow:hidden;touch-action:none}#stage{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:16px;bottom:14px;padding:8px 11px;background:#171817cc;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:11px;pointer-events:none}.mode-pill{position:absolute;top:14px;left:14px;background:#171817cc;border:1px solid var(--line);padding:7px 10px;border-radius:9px;font-size:11px;color:var(--lime)}.side{border-left:1px solid var(--line);background:#1c1e1b;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}.section-head{display:flex;justify-content:space-between;align-items:center;font-weight:750}.section-head small{color:var(--muted);font-weight:500}.layer{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid transparent;border-radius:10px;color:var(--muted);cursor:pointer}.layer.active{background:#30352d;border-color:#59634c;color:var(--ink)}.layer .dot{width:8px;height:8px;border-radius:50%;background:var(--lime)}.layer button{margin-left:auto;padding:3px 6px}.control{display:grid;gap:7px;color:var(--muted);font-size:12px}.control input{width:100%;accent-color:var(--lime)}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid #ffffff33}.bottom{border-top:1px solid var(--line);background:#1c1e1b;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:8px}.timeline{display:flex;align-items:center;gap:8px;min-width:0}.timeline input{width:min(34vw,220px);accent-color:var(--lime)}.status{font-size:11px;color:var(--muted)}.mobile-panels{display:none}
@media(max-width:760px){.app{grid-template-rows:54px 1fr 62px}.workspace{grid-template-columns:48px 1fr}.rail{padding:8px 3px}.tool{width:39px;height:39px}.side{display:none}.side.open{display:flex;position:absolute;z-index:5;right:0;top:54px;bottom:62px;width:min(290px,82vw);box-shadow:-15px 0 40px #0008}.mobile-panels{display:inline-flex}.brand{font-size:13px}.top{padding:0 9px}.top-actions button{padding:8px}.bottom{padding:7px 9px}.bottom button{padding:8px}.status{display:none}}

/* PAPER-COMIC ART DIRECTION */
:root{color-scheme:light;--bg:#eee5d2;--panel:#fff8e9;--panel2:#f6ecd8;--line:#282321;--ink:#282321;--muted:#74695d;--lime:#d8ff3e;--orange:#ff684d;--cyan:#5edce0;--violet:#8a68dc}
html,body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",ui-rounded,system-ui,sans-serif}
body{background-image:radial-gradient(#3a30251a .8px,transparent .8px);background-size:7px 7px}
button{position:relative;overflow:hidden;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px 8px 5px 7px;box-shadow:3px 3px 0 var(--line);font-weight:800;transition:transform .16s cubic-bezier(.2,.9,.2,1.3),box-shadow .16s,background .16s}
button:hover{transform:translate(-1px,-2px) rotate(-1deg);box-shadow:5px 6px 0 var(--line)}
button:active{transform:translate(2px,2px) scale(.97) rotate(1deg);box-shadow:0 0 0 var(--line)}
button.active{background:var(--lime);border-color:var(--line);color:var(--ink);box-shadow:3px 3px 0 var(--orange)}
.app{background:transparent}
.top{position:relative;z-index:2;background:#f9efd9;border-bottom:3px solid var(--line);box-shadow:0 4px 0 #28232120}
.brand{font-size:19px;font-weight:1000;letter-spacing:-1.2px;text-transform:uppercase;text-shadow:2px 2px 0 var(--cyan)}
.brand span{display:inline-block;color:var(--orange);transform:rotate(-4deg);text-shadow:2px 2px 0 var(--line)}
.sub{font-size:9px;font-weight:900;letter-spacing:2px;color:#6d6255}
.workspace{gap:0}
.rail{position:relative;background:#f0dfc1;border-right:3px solid var(--line);padding-top:14px}
.tool{width:42px;height:44px;font-size:20px;border-radius:6px 10px 5px 8px}
.viewport{background-color:#e7d7b9;background-image:radial-gradient(#30271f30 1px,transparent 1px),linear-gradient(135deg,#f5e9d1,#ddc9a6);background-size:9px 9px,100% 100%}
.viewport:before{content:"";position:absolute;inset:13px;border:2px dashed #51433330;border-radius:3px;pointer-events:none;z-index:0}
#stage{position:relative;z-index:1}
.mode-pill{top:22px;left:22px;background:#fff8e9;color:#282321;border:2px solid #282321;border-radius:3px;box-shadow:3px 3px 0 var(--orange);font-weight:1000;letter-spacing:1px}
.hint{background:#282321;color:#fff8e9;border:2px solid #282321;border-radius:4px;box-shadow:4px 4px 0 var(--cyan);font-weight:700}
.side{position:relative;background-color:#fff6e5;background-image:radial-gradient(#5a49321a .8px,transparent .8px);background-size:8px 8px;border-left:3px solid var(--line);padding:16px}
.side:before{content:"";position:absolute;top:0;left:12px;right:12px;height:7px;background:repeating-linear-gradient(90deg,var(--orange) 0 18px,transparent 18px 24px,var(--cyan) 24px 42px,transparent 42px 48px);opacity:.9}
.section-head{font-size:13px;font-weight:1000;text-transform:uppercase;letter-spacing:1px}
.section-head small{font-size:9px;letter-spacing:1px}
.layer{margin:6px 0;background:#f4e8d2;border:2px solid transparent;border-radius:4px;color:#5e5145;font-weight:800;transition:transform .18s,background .18s}
.layer:hover{transform:translateX(3px) rotate(-.5deg)}
.layer.active{background:#dff3e7;border:2px solid var(--line);color:var(--ink);box-shadow:3px 3px 0 var(--cyan)}
.layer .dot{border:1px solid var(--line);background:var(--orange)}
.layer button{box-shadow:none;border-width:1px;padding:2px 6px}
.control{color:#5e5145;font-weight:800}
.control input{accent-color:#ff684d}
.swatch{border:2px solid var(--line);box-shadow:2px 2px 0 #28232155}
.bottom{background:#f8ecd5;border-top:3px solid var(--line);box-shadow:0 -4px 0 #28232114}
.bottom button{font-size:11px}
.status{color:#65584c;font-weight:900;letter-spacing:1px}
input[type=range]{cursor:grab}
input[type=range]:active{cursor:grabbing}
@keyframes paperIn{0%{opacity:0;transform:translateY(14px) rotate(1.5deg)}70%{transform:translateY(-2px) rotate(-.5deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes stamp{0%{transform:scale(1.16) rotate(-4deg)}55%{transform:scale(.94) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.layer{animation:paperIn .34s both}
.layer:nth-child(2){animation-delay:.04s}.layer:nth-child(3){animation-delay:.08s}.layer:nth-child(4){animation-delay:.12s}
button.active{animation:stamp .24s ease-out}
@media(max-width:760px){.side.open{background-color:#fff6e5;border-left:3px solid var(--line);box-shadow:-8px 0 0 #28232125}.brand{font-size:15px}.top{background:#f9efd9}.tool{width:39px}.viewport:before{inset:8px}.mode-pill{top:16px;left:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}


/* COMIC STUDIO INTERACTION PASS */
.viewport:after{content:"";position:absolute;z-index:0;inset:5.5% 5%;pointer-events:none;background-color:#fff9e9;background-image:radial-gradient(#7b67451b .7px,transparent .7px),linear-gradient(135deg,#fffdf4,#f4e8cf);background-size:7px 7px,100% 100%;border:2px solid #282321;box-shadow:8px 9px 0 #282321,12px 13px 0 var(--orange);clip-path:polygon(0 1%,8% 0,17% 1%,26% 0,37% 1%,48% 0,60% 1%,72% 0,83% 1%,100% 0,99% 18%,100% 34%,99% 50%,100% 68%,99% 84%,100% 100%,82% 99%,65% 100%,48% 99%,31% 100%,14% 99%,0 100%,1% 82%,0 66%,1% 49%,0 32%,1% 16%);opacity:.92}
.viewport:before{z-index:0;inset:4.5%;border:2px dashed #51433335}
#stage{z-index:1}
#brushCursor{position:absolute;z-index:4;width:24px;height:24px;border:2px solid #282321;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;box-shadow:2px 2px 0 var(--orange),inset 0 0 0 3px #fff9e9aa;mix-blend-mode:multiply}
#brushCursor:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--cursor-color,var(--orange))}
.comic-pop{position:fixed;z-index:30;pointer-events:none;font-size:13px;font-weight:1000;letter-spacing:1px;color:#282321;background:var(--lime);border:2px solid #282321;padding:5px 9px;box-shadow:3px 3px 0 #282321;transform:translate(-50%,-50%) rotate(-8deg);animation:comicPop .62s cubic-bezier(.18,.85,.25,1) forwards}
@keyframes comicPop{0%{opacity:0;transform:translate(-50%,-35%) scale(.25) rotate(-20deg)}35%{opacity:1;transform:translate(-50%,-65%) scale(1.18) rotate(5deg)}70%{opacity:1;transform:translate(-50%,-95%) scale(.96) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-145%) scale(.8) rotate(7deg)}}
@keyframes panelShuffle{0%{opacity:0;transform:translateX(24px) rotate(2deg)}70%{opacity:1;transform:translateX(-4px) rotate(-.5deg)}100%{transform:translateX(0) rotate(0)}}
.side.open{animation:panelShuffle .32s cubic-bezier(.2,.8,.2,1) both}
.swatch{position:relative;transition:transform .16s,box-shadow .16s}
.swatch.selected{outline:2px dashed #282321;outline-offset:3px;transform:translateY(-3px) rotate(-7deg);box-shadow:3px 4px 0 #282321}
.section-head{position:relative;padding-bottom:6px;border-bottom:2px solid #282321}
.section-head:after{content:"";position:absolute;bottom:-3px;left:0;width:28px;height:4px;background:var(--orange);transform:rotate(-2deg)}
.top-actions button,.bottom button,.rail button{will-change:transform}
.camera-dock{position:absolute;z-index:8;right:16px;top:16px;display:flex;gap:6px;padding:6px;background:#fff8e9eF;border:2px solid #282321;box-shadow:3px 3px 0 #282321;border-radius:5px}
.camera-dock button{min-width:34px;height:34px;padding:4px 8px;font-size:16px;line-height:1}
.camera-dock button:last-child{font-size:12px}
@media(max-width:760px){.camera-dock{right:10px;top:10px;gap:4px;padding:4px}.camera-dock button{min-width:30px;height:30px;padding:3px 6px;font-size:14px}.camera-dock button:last-child{font-size:10px}}
@media(max-width:760px){.viewport:after{inset:6% 4% 7%;box-shadow:5px 6px 0 #282321,8px 9px 0 var(--orange)}#brushCursor{display:none!important}}
@media(prefers-reduced-motion:reduce){.comic-pop{display:none}.side.open{animation:none}}



/* SCENE / UI STACKING FIX
   The renderer stays beneath every viewport overlay. */
.viewport{isolation:isolate}
#stage{position:relative;z-index:1}
.viewport:before,.viewport:after{z-index:0}
.mode-pill,.hint{position:absolute;z-index:6}
#brushCursor{z-index:7}

/* RESPONSIVE PHONE MODE
   Keep the full studio on desktop, but let the phone layout fit its viewport. */
@media(max-width:760px){
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y pinch-zoom}
  .app{width:100%;min-width:0;height:100dvh;min-height:0;grid-template-rows:54px minmax(0,1fr) 62px}
  .top{padding:0 9px;gap:7px}
  .brand{font-size:15px;letter-spacing:-.7px}
  .sub{font-size:8px;letter-spacing:1.2px}
  .top-actions{gap:6px}
  .top-actions button{padding:8px 9px;font-size:12px}
  .workspace{min-height:0;min-width:0;grid-template-columns:48px minmax(0,1fr)}
  .rail{display:flex;padding:8px 3px;gap:9px}
  .tool{width:39px;height:42px;font-size:18px}
  .viewport{min-width:0;min-height:0}
  .side{display:none}
  .side.open{display:flex;position:absolute;z-index:8;right:0;top:54px;bottom:62px;width:min(290px,84vw);box-shadow:-12px 0 30px #28232155;overflow:auto}
  .mobile-panels{display:inline-flex}
  .bottom{min-width:0;padding:7px 9px;gap:6px}
  .bottom .tools{gap:6px;min-width:0}
  .bottom button{padding:8px 9px;font-size:10px;white-space:nowrap}
  .timeline{gap:5px;min-width:0;flex:1;justify-content:flex-end}
  .timeline input{width:clamp(52px,18vw,110px);min-width:0}
  .status{display:none}
  .viewport:before{inset:8px}
  .viewport:after{inset:6% 4% 7%;box-shadow:5px 6px 0 #282321,8px 9px 0 var(--orange)}
  .mode-pill{top:12px;left:12px;padding:6px 8px;font-size:9px}
  .hint{left:12px;bottom:12px;max-width:calc(100% - 24px);font-size:10px}
}
@media(max-width:390px){
  .brand{font-size:13px}
  .top-actions button{padding:7px 7px}
  .bottom button{padding:7px 7px;font-size:9px}
  .timeline input{width:48px}
}
@media(max-width:760px) and (orientation:landscape){
  .app{grid-template-rows:48px minmax(0,1fr) 54px}
  .side.open{top:48px;bottom:54px}
  .rail{padding:5px 3px;gap:6px}
  .tool{height:36px}
  .bottom{padding:5px 8px}
  .viewport:after{inset:4% 5%}
}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">TETHERLESS<span>3D</span></div><div class="sub">CUT PAPER · INK · IMAGINATION</div></div><div class="top-actions"><button id="mode2d" class="active">2D</button><button id="mode3d">3D</button><button id="panelBtn" class="mobile-panels">☷</button><button id="saveBtn">Save</button></div></header>
<main class="workspace"><nav class="rail">
<button class="tool active" id="drawTool" title="Draw">✎</button><button class="tool" id="selectTool" title="Select / transform">↗</button><button class="tool" id="orbitTool" title="Orbit camera">◎</button><button class="tool" id="undoBtn" title="Undo">↶</button><button class="tool" id="redoBtn" title="Redo">↷</button>
</nav><section class="viewport"><canvas id="stage"></canvas><div id="brushCursor"></div><div class="mode-pill" id="modeLabel">PAPER CANVAS · FRONT VIEW</div><div class="camera-dock" aria-label="Camera controls"><button id="zoomOut" title="Zoom out">−</button><button id="zoomIn" title="Zoom in">＋</button><button id="cameraReset" title="Reset camera">⌂</button></div><div class="hint" id="hint">Draw with one finger · Select a layer to move the whole drawing</div></section>
<aside class="side" id="side">
<div><div class="section-head">Layers <button id="addLayer">＋</button></div><div id="layers"></div></div>
<div><div class="section-head">Brush <small id="sizeVal">6 px</small></div>
<label class="control">Size<input id="brushSize" type="range" min="1" max="36" value="6"></label>
<label class="control">Opacity<input id="opacity" type="range" min="10" max="100" value="100"></label>
<div class="swatches" id="swatches"><button class="swatch" data-color="#d9f78a" style="background:#d9f78a"></button><button class="swatch" data-color="#ff9473" style="background:#ff9473"></button><button class="swatch" data-color="#8bd9ff" style="background:#8bd9ff"></button><button class="swatch" data-color="#f1eee4" style="background:#f1eee4"></button><button class="swatch" data-color="#c49aff" style="background:#c49aff"></button></div></div>
<div><div class="section-head">Animation <small>keyframes</small></div><button id="keyBtn" style="width:100%">＋ Add keyframe</button><button id="playBtn" style="width:100%;margin-top:7px">▶ Play preview</button><div class="sub" id="frameInfo" style="margin-top:7px">0 keyframes · 12 FPS</div></div>
</aside></main>
<footer class="bottom"><div class="tools"><button id="newBtn">＋ Layer</button><button id="clearBtn">Clear</button><button id="exportBtn">Export PNG</button></div><div class="timeline"><span class="status">FRAME</span><input id="frameSlider" type="range" min="0" max="100" value="0"><span id="frameNo" class="status">0</span></div></footer>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
const canvas=document.querySelector('#stage'), viewport=document.querySelector('.viewport');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(viewport.clientWidth,viewport.clientHeight,false);
const scene=new THREE.Scene();scene.background=null;
const camera=new THREE.PerspectiveCamera(42,viewport.clientWidth/viewport.clientHeight,.1,100);camera.position.set(0,0,12);
const ambient=new THREE.HemisphereLight(0xffffff,0x555566,2);scene.add(ambient);
const grid=new THREE.GridHelper(20,20,0x59604e,0x343a32);grid.rotation.x=Math.PI/2;grid.position.z=-2.5;scene.add(grid);
const root=new THREE.Group();scene.add(root);
const transform=new TransformControls(camera,renderer.domElement);scene.add(transform.getHelper());transform.setMode('translate');transform.addEventListener('dragging-changed',e=>{orbit.enabled=!e.value;});
const orbit=new (await import('three/addons/controls/OrbitControls.js')).OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.08;orbit.enableZoom=true;orbit.enablePan=true;orbit.enableRotate=true;orbit.minDistance=2.5;orbit.maxDistance=40;orbit.zoomSpeed=.9;orbit.panSpeed=.85;orbit.rotateSpeed=.75;orbit.target.set(0,0,0);orbit.enabled=false;
let activeLayer=0,tool='draw',is3D=false,color='#d9f78a',brushSize=6,opacity=1,drawing=false,currentPoints=[],currentLine=null,undoStack=[],redoStack=[],keyframes=[],playing=false,playStart=0;
const layers=[];
function addLayer(name='Layer '+(layers.length+1)){const group=new THREE.Group();group.name=name;root.add(group);layers.push({name,group,visible:true});activeLayer=layers.length-1;renderLayers();}
addLayer('Starfish');addLayer('Details');activeLayer=0;
function renderLayers(){const el=document.querySelector('#layers');el.innerHTML='';layers.forEach((l,i)=>{const row=document.createElement('div');row.className='layer'+(i===activeLayer?' active':'');row.innerHTML='<span class="dot"></span><span></span><button title="Visibility">◉</button>';row.children[1].textContent=l.name;row.addEventListener('click',e=>{if(e.target.tagName==='BUTTON'){l.visible=!l.visible;l.group.visible=l.visible;e.target.textContent=l.visible?'◉':'○';return;}activeLayer=i;renderLayers();if(tool==='select'&&l.group.children.length)transform.attach(l.group);});el.append(row);});}
function snapshot(){undoStack.push(root.toJSON());if(undoStack.length>40)undoStack.shift();redoStack=[];}
function restore(json){const parsed=new THREE.ObjectLoader().parse(json);root.clear();while(parsed.children.length)root.add(parsed.children[0]);}
function pointFromEvent(e){const rect=canvas.getBoundingClientRect(),x=((e.clientX-rect.left)/rect.width)*2-1,y=-((e.clientY-rect.top)/rect.height)*2+1;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(x,y),camera);const plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);const p=new THREE.Vector3();ray.ray.intersectPlane(plane,p);return p;}
function makeStroke(points){if(points.length<2)return;const curve=new THREE.CatmullRomCurve3(points);const radius=brushSize*.006;const geometry=new THREE.TubeGeometry(curve,Math.max(12,points.length*3),radius,7,false);const material=new THREE.MeshBasicMaterial({color,transparent:opacity<1,opacity});const mesh=new THREE.Mesh(geometry,material);mesh.userData.stroke=true;layers[activeLayer].group.add(mesh);}
canvas.addEventListener('pointerdown',e=>{if(tool!=='draw'||transform.dragging)return;drawing=true;canvas.setPointerCapture(e.pointerId);currentPoints=[pointFromEvent(e)];});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pointFromEvent(e);if(currentPoints[currentPoints.length-1].distanceTo(p)>.025)currentPoints.push(p);});
canvas.addEventListener('pointerup',()=>{if(!drawing)return;drawing=false;snapshot();makeStroke(currentPoints);currentPoints=[];});
function setTool(t){tool=t;document.querySelectorAll('.rail .tool').forEach(b=>b.classList.remove('active'));({draw:'#drawTool',select:'#selectTool',orbit:'#orbitTool'}[t]&&document.querySelector(({draw:'#drawTool',select:'#selectTool',orbit:'#orbitTool'}[t])).classList.add('active'));if(t==='draw'){transform.detach();orbit.enabled=false;}if(t==='select'){orbit.enabled=false;const g=layers[activeLayer].group;if(g.children.length)transform.attach(g);}if(t==='orbit'){transform.detach();orbit.enabled=true;orbit.enableRotate=is3D;orbit.enablePan=true;orbit.enableZoom=true;}canvas.style.cursor=t==='draw'?'none':'grab';brushCursor.style.display='none';document.querySelector('#hint').textContent=t==='orbit'?(is3D?'Drag to orbit · Pinch or wheel to zoom · Two fingers to pan':'Drag to pan · Pinch or wheel to zoom'):'Draw with one finger · Select a layer to move the whole drawing';}
document.querySelector('#drawTool').onclick=()=>setTool('draw');document.querySelector('#selectTool').onclick=()=>setTool('select');document.querySelector('#orbitTool').onclick=()=>setTool('orbit');
function resetCamera(){orbit.target.set(0,0,0);camera.up.set(0,1,0);camera.position.set(is3D?9:0,is3D?7:0,is3D?12:12);camera.fov=42;camera.updateProjectionMatrix();orbit.update();}\nfunction cameraZoom(factor){const offset=camera.position.clone().sub(orbit.target);offset.multiplyScalar(factor);const distance=THREE.MathUtils.clamp(offset.length(),orbit.minDistance,orbit.maxDistance);offset.setLength(distance);camera.position.copy(orbit.target).add(offset);orbit.update();}document.querySelector('#zoomIn').onclick=()=>cameraZoom(.8);document.querySelector('#zoomOut').onclick=()=>cameraZoom(1.25);document.querySelector('#cameraReset').onclick=()=>{resetCamera();};\ndocument.querySelector('#mode2d').onclick=()=>{is3D=false;camera.position.set(0,0,12);camera.up.set(0,1,0);orbit.target.set(0,0,0);camera.lookAt(0,0,0);camera.fov=42;camera.updateProjectionMatrix();orbit.enableRotate=false;orbit.enabled=tool==='orbit';document.querySelector('#mode2d').classList.add('active');document.querySelector('#mode3d').classList.remove('active');document.querySelector('#modeLabel').textContent='PAPER CANVAS · FRONT VIEW';grid.visible=true;};
document.querySelector('#mode3d').onclick=()=>{is3D=true;camera.position.set(9,7,12);camera.up.set(0,1,0);orbit.target.set(0,0,0);camera.lookAt(0,0,0);camera.updateProjectionMatrix();orbit.enableRotate=true;document.querySelector('#mode3d').classList.add('active');document.querySelector('#mode2d').classList.remove('active');document.querySelector('#modeLabel').textContent='POP-UP SPACE · ORBIT VIEW';grid.visible=true;setTool('orbit');};
document.querySelector('#addLayer').onclick=()=>addLayer();document.querySelector('#newBtn').onclick=()=>addLayer();
document.querySelector('#brushSize').oninput=e=>{brushSize=+e.target.value;document.querySelector('#sizeVal').textContent=brushSize+' px';};
document.querySelector('#opacity').oninput=e=>opacity=+e.target.value/100;
document.querySelectorAll('.swatch').forEach((b,i)=>{if(i===0)b.classList.add('selected');b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected',s===b));document.querySelector('#brushCursor').style.setProperty('--cursor-color',color);};});
const brushCursor=document.querySelector('#brushCursor');
viewport.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||tool!=='draw'){brushCursor.style.display='none';return;}const r=viewport.getBoundingClientRect();brushCursor.style.display='block';brushCursor.style.left=(e.clientX-r.left)+'px';brushCursor.style.top=(e.clientY-r.top)+'px';brushCursor.style.width=brushCursor.style.height=Math.max(12,brushSize*2)+'px';});
viewport.addEventListener('pointerleave',()=>brushCursor.style.display='none');
function comicPop(x,y,label='NICE!'){const el=document.createElement('div');el.className='comic-pop';el.textContent=label;el.style.left=x+'px';el.style.top=y+'px';document.body.append(el);setTimeout(()=>el.remove(),650);}
document.querySelectorAll('.top-actions button,.bottom button,.rail button').forEach(btn=>btn.addEventListener('click',()=>{const r=btn.getBoundingClientRect();const labels={'saveBtn':'SAVED!','exportBtn':'INK IT!','addLayer':'NEW PAGE!','newBtn':'NEW PAGE!','clearBtn':'FRESH SHEET!','keyBtn':'SNAP!','playBtn':'ACTION!','mode3d':'POP OUT!','mode2d':'FLAT!'};const label=labels[btn.id];if(label)comicPop(r.left+r.width/2,r.top+r.height/2,label);}));
document.querySelector('#clearBtn').onclick=()=>{snapshot();layers[activeLayer].group.clear();transform.detach();};
document.querySelector('#undoBtn').onclick=()=>{if(!undoStack.length)return;redoStack.push(root.toJSON());restore(undoStack.pop());};
document.querySelector('#redoBtn').onclick=()=>{if(!redoStack.length)return;undoStack.push(root.toJSON());restore(redoStack.pop());};
document.querySelector('#saveBtn').onclick=()=>{const data={version:1,layers:root.toJSON(),keyframes};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='tetherless3d-project.json';a.click();URL.revokeObjectURL(a.href);};
document.querySelector('#exportBtn').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='tetherless3d-artwork.png';a.click();};
document.querySelector('#panelBtn').onclick=()=>document.querySelector('#side').classList.toggle('open');
document.querySelector('#keyBtn').onclick=()=>{const g=layers[activeLayer].group;keyframes.push({time:keyframes.length,layer:activeLayer,position:g.position.toArray(),rotation:g.rotation.toArray(),scale:g.scale.toArray()});document.querySelector('#frameInfo').textContent=keyframes.length+' keyframes · layer: '+layers[activeLayer].name;document.querySelector('#frameSlider').max=Math.max(100,keyframes.length*100);};
document.querySelector('#playBtn').onclick=()=>{playing=!playing;playStart=performance.now();document.querySelector('#playBtn').textContent=playing?'Ⅱ Pause preview':'▶ Play preview';};
document.querySelector('#frameSlider').oninput=e=>document.querySelector('#frameNo').textContent=e.target.value;
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(viewport);
function animate(now){requestAnimationFrame(animate);orbit.update();if(playing&&keyframes.length>1){const duration=Math.max(1,...keyframes.map(k=>k.time));const t=((now-playStart)/1000)%duration;for(let li=0;li<layers.length;li++){const track=keyframes.filter(k=>k.layer===li).sort((a,b)=>a.time-b.time);if(!track.length)continue;let a=track[0],b=track[track.length-1];for(let j=0;j<track.length-1;j++){if(t>=track[j].time&&t<=track[j+1].time){a=track[j];b=track[j+1];break;}}const span=Math.max(.0001,b.time-a.time),f=THREE.MathUtils.clamp((t-a.time)/span,0,1),g=layers[li].group;g.position.fromArray(a.position).lerp(new THREE.Vector3(...b.position),f);g.rotation.set(...a.rotation.map((v,i)=>THREE.MathUtils.lerp(v,b.rotation[i],f)));g.scale.fromArray(a.scale).lerp(new THREE.Vector3(...b.scale),f);}}renderer.render(scene,camera);}
requestAnimationFrame(animate);renderLayers();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
